feature:
    name: eigenbeleg
    product: Go CLI library and tool
    description: A library and CLI tool that generates an eigenbeleg PDF

components:
    PDFLIB:
      name: PDF receipt generator Go library
      requirements: 
        1: Takes the following input
        1-1: receipt number (string)
        1-2: amount (number)
        1-3: subject (string)
        1-4: recipient (string)
        1-5: type (string)
        1-6: reason (string)
        1-7: date (date)
        1-8: path to signature image (string)
        1-9: path to header image (string)
        2: Generate and return a PDF with the following content, from top to bottom
          - Header image
          - Title "Eigenbeleg"
          - Field "Nr." with receipt number
          - Field "Einnahme" or "Ausgabe", respectively, with the amount
          - Field "Vorgang" with the subject
          - Field "Empfänger" with the recipient
          - Field "Art der Aufwendung" with the type
          - Field "Grund des Eigenbelegs" with the reason
          - A line with the date and the signature image, alinged at the bottom
          - A hrule
          - A line with the words "Datum" below the date, left-aligned with the date, and "Unterschrift" below the signature image, left-aligned with the signature image

    CLI:
      requirements:
        1: Collect the input for the library, plus a path to the output file
        2: Verify the input, exit with an error if input is missing or doesn't evaluate to the expected format (esp. amount and date)
        3: Call the library with the verified input
        4: Write the output to the given output path
        5: If the tool is called without any arguments, print out the usage, just like `eigenbeleg --help`

constraints:
    CONTENT:
      requirements:
        1: Amount may be positive (for revenue) or negative (for expenses)
        1-1: Always write a positive amount to the PDF
        1-2: If the input amount is negative, title the amount "Ausgabe", else "Einnahme"
        1-3: Amount format is German, 1.234,56 €
        2: Date is optional; default is the current date
        2-1: Date format on the PDF is DD.MM.YYYY
        3: PDF size is A4
        4: Header image is optional
        5: Signature images is mandatory
        6: If no type is given, then if the amount is negative, the type is "Privatentnahme"; if the amount is positive, the type is "Privateinlage"
        7: If no subject is given, then if the amount is negative, the subject is "Privatentnahme"; if the amount is positive, the subject is "Privateinlage"
    IMPLEMENTATION:
      requirements:
        1: The library shall return a []byte
        2: Use https://codeberg.org/go-pdf/fpdf for generating the PDF
        3: Use https://github.com/christophberger/start to collect the input for the library and the path to the output file as flags, env vars, or from a config file
        4: Images can be png or jpeg
        5: The output path defaults to `./<date> Eigenbeleg <number>.pdf`, where <date> is the date input value as YYYY-MM-DD and <number> is the number input value
        6: After validating the input, print out the fields filled out with inputs and defaults and have the user confirm to proceed. 

